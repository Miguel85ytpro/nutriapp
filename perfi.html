<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NutriApp{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-light bg-success bg-gradient shadow-sm">
    <div class="container">
      <a href="/" class="navbar-brand text-white fw-bold">NutriApp</a>
      <div class="d-flex">
        {% if user_authenticated %}
          <a href="/perfil" class="btn btn-light me-2">Perfil</a>
          <a href="/logout" class="btn btn-danger">Cerrar sesión</a>
        {% else %}
          <a href="/login" class="btn btn-light me-2">Iniciar sesión</a>
          <a href="/registro" class="btn btn-light">Registrarse</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    {% block content %}
    {% endblock %}
  </main>

  <footer class="text-center py-3 bg-dark text-white-50 mt-auto">
    <p class="mb-0">Miguel Ángel Cárcamo Limón — 3°D</p>
    <p class="mb-0">Damián Corral López — 3°D</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
