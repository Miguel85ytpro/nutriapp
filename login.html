<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-light bg-success bg-gradient shadow-sm">
    <div class="container">
        <a href="/" class="navbar-brand text-white fw-bold">NutriApp</a>
    </div>
    </nav>

    <main class="container my-5 flex-grow-1">
    <div class="card shadow-sm mx-auto" style="max-width: 400px;">
        <div class="card-body">
        <h1 class="text-center mb-4 text-success">Inicio de Sesión</h1>
        <form id="loginForm">
            <div class="mb-3">
            <label for="emailLogin" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="emailLogin" placeholder="Tu correo electrónico" required>
            </div>

            <div class="mb-3">
            <label for="passwordLogin" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="passwordLogin" placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="btn btn-success w-100">Iniciar sesión</button>
        </form>
        <div class="text-center mt-3">
            <a href="/registro" class="text-decoration-none">¿No tienes cuenta? Regístrate aquí</a>
        </div>
        </div>
    </div>
    </main>

    <footer class="text-center py-3 bg-dark text-white-50">
    <p class="mb-0">Miguel Ángel Cárcamo Limón — 3°D</p>
    <p class="mb-0">Damián Corral López — 3°D</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();

        alert('Inicio de sesión exitoso');
        window.location.href = '/perfil';
    });
    </script>
</body>
</html>
