<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro NutriApp</title> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-light bg-success bg-gradient shadow-sm">
    <div class="container">
      <a href="/" class="navbar-brand text-white fw-bold">NutriApp</a>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
      <div class="card-body">
        <h1 class="text-center mb-4 text-success">Registro de Usuario</h1>
        <form id="registroForm">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
          </div>

          <div class="mb-3">
            <label for="apellido" class="form-label">Apellidos</label>
            <input type="text" class="form-control" id="apellido" placeholder="Tus apellidos" required>
          </div>

          <div class="mb-3">
            <label for="edad" class="form-label">Edad</label>
            <input type="number" class="form-control" id="edad" placeholder="Tu edad" required>
          </div>

          <div class="mb-3">
            <label for="sexo" class="form-label">Sexo</label>
            <select id="sexo" class="form-select" required>
              <option value="Masculino">Masculino</option>
              <option value="Femenino">Femenino</option>
              <option value="Otro">Otro</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="peso" class="form-label">Peso (kg)</label>
            <input type="number" class="form-control" id="peso" placeholder="Tu peso en kg" required>
          </div>

          <div class="mb-3">
            <label for="altura" class="form-label">Altura (cm)</label>
            <input type="number" class="form-control" id="altura" placeholder="Tu altura en cm" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="Tu correo electrónico" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" placeholder="Crea una contraseña" required>
          </div>

          <!-- Objetivos -->
          <div class="mb-3">
            <label for="objetivos" class="form-label">Objetivo</label>
            <select id="objetivos" class="form-select" required>
              <option value="Bajar de peso">Bajar de peso</option>
              <option value="Aumentar masa muscular">Aumentar masa muscular</option>
              <option value="Mantener peso">Mantener peso</option>
              <option value="Mejorar digestión">Mejorar digestión</option>
              <option value="Controlar una condición">Controlar una condición (diabetes, hipertensión)</option>
            </select>
          </div>

          <!-- Restricciones y Preferencias -->
          <div class="mb-3">
            <label for="restricciones" class="form-label">Restricciones Alimenticias</label>
            <input type="text" class="form-control" id="restricciones" placeholder="Ej. Alergias, intolerancias">
          </div>

          <button type="submit" class="btn btn-success w-100">Registrar</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="text-center py-3 bg-dark text-white-50">
    <p class="mb-0">Miguel Ángel Cárcamo Limón — 3°D</p>
    <p class="mb-0">Damián Corral López — 3°D</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('registroForm').addEventListener('submit', function(event) {
      event.preventDefault();
      alert('Registro exitoso');
      window.location.href = '/login';
    });
  </script>
</body>
</html>
